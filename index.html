<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N1 総合対策 — 例句・聴解・読解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:oklch(98% 0.002 90);
  --sidebar-bg:oklch(95% 0.006 240);
  --text:oklch(22% 0.008 240);
  --text-dim:oklch(50% 0.008 240);
  --text-light:oklch(70% 0.005 240);
  --accent:oklch(45% 0.13 245);
  --accent-light:oklch(80% 0.06 245);
  --border:oklch(88% 0.008 240);
  --correct:oklch(55% 0.16 155);
  --correct-bg:oklch(95% 0.04 155);
  --wrong:oklch(50% 0.18 25);
  --wrong-bg:oklch(95% 0.04 25);
  --radius:6px;
  --sidebar-w:240px;
  --font:'Noto Sans JP',system-ui,-apple-system,sans-serif;
}
html{font-family:var(--font);color:var(--text);background:var(--bg);scroll-behavior:smooth}
body{display:flex;min-height:100vh}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--sidebar-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:2rem 1.25rem;
  position:fixed;top:0;left:0;bottom:0;z-index:100;
  overflow-y:auto;
}
.sidebar-logo{font-size:1.05rem;font-weight:700;letter-spacing:.04em;color:var(--accent);margin-bottom:2rem;line-height:1.3}
.sidebar-logo span{display:block;font-size:.75rem;font-weight:400;color:var(--text-dim);margin-top:2px}
.sidebar-nav{list-style:none;display:flex;flex-direction:column;gap:2px}
.sidebar-nav a{
  display:flex;align-items:center;gap:10px;padding:.7rem .85rem;
  text-decoration:none;color:var(--text-dim);font-size:.88rem;
  border-radius:var(--radius);transition:all .15s;font-weight:400;
  border:1px solid transparent;
}
.sidebar-nav a:hover{background:var(--border);color:var(--text)}
.sidebar-nav a.active{background:var(--accent);color:#fff;font-weight:500}
.sidebar-nav .count{font-size:.7rem;opacity:.7;margin-left:auto}
.sidebar-stats{margin-top:auto;padding-top:1.5rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--text-light);line-height:1.6}

/* ===== Main Content ===== */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.section{display:none;padding:2.5rem 3rem;max-width:880px}
.section.active{display:block}
.section-title{font-size:1.6rem;font-weight:700;margin-bottom:.3rem;letter-spacing:.02em}
.section-subtitle{font-size:.82rem;color:var(--text-dim);margin-bottom:2rem}

/* ===== Module Tabs ===== */
.module-tabs{display:flex;gap:4px;margin-bottom:1.75rem;flex-wrap:wrap}
.module-tab{
  padding:.45rem 1rem;font-size:.8rem;border:1px solid var(--border);
  background:var(--bg);border-radius:20px;cursor:pointer;
  color:var(--text-dim);transition:all .15s;font-family:inherit;
}
.module-tab:hover{border-color:var(--accent);color:var(--accent)}
.module-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== Search ===== */
.search-wrap{position:relative;margin-bottom:1.5rem}
.search-input{
  width:100%;padding:.6rem 1rem .6rem 2.5rem;font-size:.85rem;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg);color:var(--text);font-family:inherit;
  transition:border-color .15s;
}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-icon{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:.85rem}

/* ===== Example Card ===== */
.example-card{
  padding:1rem 1.25rem;border-bottom:1px solid var(--border);
  transition:background .12s;
}
.example-card:hover{background:oklch(97% 0.005 240)}
.example-jp{font-size:1.08rem;line-height:1.7;margin-bottom:.4rem;font-weight:400}
.example-cn{font-size:.82rem;color:var(--text-dim);margin-bottom:.5rem}
.example-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.example-tag{
  font-size:.68rem;padding:.15rem .5rem;border-radius:12px;
  background:var(--accent-light);color:var(--accent);font-weight:500;
}
.example-tag.vocab{background:oklch(93% 0.03 90);color:oklch(42% 0.08 70)}
.btn-play{
  display:inline-flex;align-items:center;gap:4px;
  padding:.25rem .6rem;font-size:.72rem;border:1px solid var(--border);
  background:var(--bg);border-radius:14px;cursor:pointer;
  color:var(--text-dim);transition:all .12s;font-family:inherit;
  margin-left:auto;
}
.btn-play:hover{border-color:var(--accent);color:var(--accent)}
.btn-play.playing{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-play svg{width:14px;height:14px}

/* ===== Pagination ===== */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin:2rem 0 1rem}
.page-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--bg);border-radius:var(--radius);
  cursor:pointer;font-size:.8rem;color:var(--text-dim);font-family:inherit;
  transition:all .12s;
}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.page-btn:disabled{opacity:.3;cursor:default}
.page-info{font-size:.78rem;color:var(--text-light);margin:0 8px}

/* ===== Listening ===== */
.listening-card{
  padding:1.25rem 1.5rem;border:1px solid var(--border);
  margin-bottom:1rem;border-radius:var(--radius);
  background:var(--bg);
}
.listening-type{
  font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);margin-bottom:.6rem;font-weight:500;
}
.listening-script{
  font-size:.95rem;line-height:1.8;padding:1rem;margin-bottom:1rem;
  background:oklch(97% 0.004 240);border-radius:var(--radius);
  white-space:pre-wrap;
}
.listening-question{font-size:.92rem;font-weight:500;margin-bottom:.8rem;color:var(--text)}
.listening-options{display:flex;flex-direction:column;gap:6px}
.listening-opt{
  padding:.65rem 1rem;border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;font-size:.85rem;transition:all .12s;text-align:left;
  background:var(--bg);font-family:inherit;color:var(--text);
}
.listening-opt:hover:not(.answered){border-color:var(--accent)}
.listening-opt.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.listening-opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.listening-opt.answered{cursor:default}
.result-icon{display:inline-block;width:20px;margin-right:6px;font-weight:700}
.listening-original{margin-top:1rem}
.btn-reveal{
  font-size:.75rem;padding:.35rem .8rem;border:1px solid var(--border);
  background:transparent;border-radius:14px;cursor:pointer;color:var(--text-dim);
  font-family:inherit;transition:all .12s;
}
.btn-reveal:hover{border-color:var(--accent);color:var(--accent)}
.original-text{display:none;margin-top:.8rem;padding:.8rem 1rem;font-size:.85rem;line-height:1.7;background:oklch(97% 0.004 240);border-radius:var(--radius);white-space:pre-wrap}
.original-text.show{display:block}
.explanation-text{font-size:.78rem;color:var(--text-dim);margin-top:.6rem;padding-left:.5rem;border-left:2px solid var(--accent-light)}

/* ===== Reading ===== */
.reading-card{
  padding:1.5rem;border:1px solid var(--border);
  margin-bottom:1.5rem;border-radius:var(--radius);
  background:var(--bg);
}
.reading-title{font-size:1.1rem;font-weight:700;margin-bottom:.8rem;line-height:1.4}
.reading-content{
  font-size:.95rem;line-height:2;margin-bottom:1.5rem;
  white-space:pre-wrap;
}
.reading-content-a,.reading-content-b{
  font-size:.9rem;line-height:1.9;padding:1rem;margin-bottom:.8rem;
  background:oklch(97% 0.004 240);border-radius:var(--radius);
  white-space:pre-wrap;
}
.reading-label{font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:.3rem}
.reading-question-block{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.reading-question-text{font-size:.9rem;font-weight:500;margin-bottom:.6rem}

/* ===== Speech Button ===== */
.btn-speech{
  display:inline-flex;align-items:center;gap:5px;
  padding:.35rem .85rem;font-size:.75rem;border:1px solid var(--border);
  background:var(--bg);border-radius:14px;cursor:pointer;
  color:var(--text-dim);transition:all .12s;font-family:inherit;
  margin-bottom:.8rem;
}
.btn-speech:hover{border-color:var(--accent);color:var(--accent)}
.btn-speech.speaking{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== Responsive ===== */
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{
    position:relative;width:100%;min-width:100%;flex-direction:row;
    padding:1rem;align-items:center;overflow-x:auto;gap:4px;
  }
  .sidebar-logo{font-size:.85rem;margin:0 1rem 0 0;white-space:nowrap}
  .sidebar-logo span{display:none}
  .sidebar-nav{flex-direction:row;gap:2px}
  .sidebar-nav a{padding:.4rem .65rem;font-size:.76rem;white-space:nowrap}
  .sidebar-nav .count{display:none}
  .sidebar-stats{display:none}
  .main{margin-left:0}
  .section{padding:1.5rem 1rem}
}

/* ===== Utility ===== */
.loading{text-align:center;padding:3rem;color:var(--text-light)}
.empty{text-align:center;padding:2rem;color:var(--text-light);font-size:.9rem}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sidebar">
  <div class="sidebar-logo">JLPT N1<span>総合対策</span></div>
  <nav>
    <ul class="sidebar-nav">
      <li><a href="#examples" data-module="examples" class="active">📝 例文 <span class="count">200</span></a></li>
      <li><a href="#listening" data-module="listening">🎧 聴解 <span class="count">200</span></a></li>
      <li><a href="#reading" data-module="reading">📖 読解 <span class="count">30</span></a></li>
    </ul>
  </nav>
  <div class="sidebar-stats">
    文字・語彙・文法・聴解・読解<br>
    Microsoft Nanami Neural TTS
  </div>
</aside>

<!-- ===== Main Content ===== -->
<main class="main">

<!-- ====== 例句模块 ====== -->
<section id="examples" class="section active">
  <h2 class="section-title">例文</h2>
  <p class="section-subtitle">N1 文法・語彙を網羅した 200 の例文。タップでネイティブ発音を再生。</p>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="exampleSearch" placeholder="文法・語彙で検索…（例：〜までもない、綿密）">
  </div>

  <div id="exampleList"></div>
  <div class="pagination" id="examplePagination"></div>
</section>

<!-- ====== 听力模块 ====== -->
<section id="listening" class="section">
  <h2 class="section-title">聴解</h2>
  <p class="section-subtitle">N1 本試験形式の問題 200 問。選択肢をクリックして正誤判定。原文は隠されています。</p>

  <div class="module-tabs" id="listeningTabs">
    <button class="module-tab active" data-type="all">すべて</button>
    <button class="module-tab" data-type="課題理解">課題理解 (60)</button>
    <button class="module-tab" data-type="ポイント理解">ポイント理解 (60)</button>
    <button class="module-tab" data-type="概要理解">概要理解 (40)</button>
    <button class="module-tab" data-type="即時応答">即時応答 (40)</button>
  </div>

  <div id="listeningList"></div>
  <div class="pagination" id="listeningPagination"></div>
</section>

<!-- ====== 阅读模块 ====== -->
<section id="reading" class="section">
  <h2 class="section-title">読解</h2>
  <p class="section-subtitle">N1 本試験形式の読解問題 30 篇。選択肢をクリックして正誤判定。</p>

  <div class="module-tabs" id="readingTabs">
    <button class="module-tab active" data-type="all">すべて</button>
    <button class="module-tab" data-type="内容理解（短文）">短文 (9)</button>
    <button class="module-tab" data-type="内容理解（中文）">中文 (7)</button>
    <button class="module-tab" data-type="内容理解（長文）">長文 (5)</button>
    <button class="module-tab" data-type="統合理解">統合理解 (4)</button>
    <button class="module-tab" data-type="主張理解（長文）">主張理解 (3)</button>
    <button class="module-tab" data-type="情報検索">情報検索 (2)</button>
  </div>

  <div id="readingList"></div>
  <div class="pagination" id="readingPagination"></div>
</section>

</main>

<script src="data.js"></script>
<script>
// ===== 全局状态 =====
const PER_PAGE = {examples:20, listening:10, reading:1};
const state = {
  module: 'examples',
  // examples
  examplePage: 1, exampleFiltered: EXAMPLES, exampleQuery:'',
  // listening
  listeningPage: 1, listeningType:'all', listeningFiltered: LISTENING,
  // reading
  readingPage: 1, readingType:'all', readingFiltered: READINGS,
};

// ===== Sidebar Navigation =====
document.querySelectorAll('.sidebar-nav a').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const mod = a.dataset.module;
    switchModule(mod);
  });
});

function switchModule(mod){
  state.module = mod;
  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.toggle('active',a.dataset.module===mod));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===mod));
  if(mod==='examples') renderExamples();
  else if(mod==='listening') renderListening();
  else if(mod==='reading') renderReading();
}

// ===== Audio Player (single shared) =====
let audioEl = null;
function getAudio(){if(!audioEl)audioEl=new Audio();return audioEl}

function playExampleAudio(id){
  const audio = getAudio();
  const btn = document.querySelector(`.btn-play[data-id="${id}"]`);
  if(audio.src.includes(`/${String(id).padStart(4,'0')}.mp3`) && !audio.paused){
    audio.pause();
    if(btn)btn.classList.remove('playing');
    return;
  }
  // Stop all playing indicators
  document.querySelectorAll('.btn-play.playing').forEach(b=>b.classList.remove('playing'));
  audio.src = `audio/${String(id).padStart(4,'0')}.mp3`;
  audio.play().catch(e=>console.warn('Audio play failed:',e));
  if(btn)btn.classList.add('playing');
  audio.onended = ()=>{if(btn)btn.classList.remove('playing')};
  audio.onerror = ()=>{if(btn){btn.classList.remove('playing');btn.textContent='⚠ 音声なし'}};
}

// ===== Web Speech API for Listening =====
let speechSynth = window.speechSynthesis;
let speaking = false;

function speakText(text, btnEl){
  if(speaking){speechSynth.cancel();speaking=false;if(btnEl)btnEl.classList.remove('speaking');return}
  speechSynth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.9;
  utter.onstart = ()=>{speaking=true;if(btnEl)btnEl.classList.add('speaking')};
  utter.onend = ()=>{speaking=false;if(btnEl)btnEl.classList.remove('speaking')};
  utter.onerror = ()=>{speaking=false;if(btnEl)btnEl.classList.remove('speaking')};
  speechSynth.speak(utter);
}

// ===== Render Examples =====
function renderExamples(){
  const list = document.getElementById('exampleList');
  const pag = document.getElementById('examplePagination');
  const total = state.exampleFiltered.length;
  const totalPages = Math.ceil(total/PER_PAGE.examples);
  if(state.examplePage>totalPages) state.examplePage = totalPages||1;

  const start = (state.examplePage-1)*PER_PAGE.examples;
  const items = state.exampleFiltered.slice(start, start+PER_PAGE.examples);

  list.innerHTML = items.length===0
    ? '<div class="empty">該当する例文がありません</div>'
    : items.map(e=>`
      <div class="example-card">
        <div class="example-jp">${escHtml(e.jp)}</div>
        <div class="example-cn">${escHtml(e.cn)}</div>
        <div class="example-meta">
          <span class="example-tag">${escHtml(e.grammar)}</span>
          <span class="example-tag vocab">${escHtml(e.vocab)}</span>
          <button class="btn-play" data-id="${e.id}" onclick="playExampleAudio(${e.id})" title="再生">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 発音
          </button>
        </div>
      </div>`).join('');

  // pagination
  let ph = '';
  if(totalPages>1){
    ph += `<button class="page-btn" onclick="state.examplePage=1;renderExamples()" ${state.examplePage===1?'disabled':''}>«</button>`;
    ph += `<button class="page-btn" onclick="state.examplePage--;renderExamples()" ${state.examplePage===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=totalPages;i++){
      if(i===1||i===totalPages||(i>=state.examplePage-2&&i<=state.examplePage+2)){
        ph += `<button class="page-btn${i===state.examplePage?' active':''}" onclick="state.examplePage=${i};renderExamples()">${i}</button>`;
      } else if(i===state.examplePage-3||i===state.examplePage+3){
        ph += `<span class="page-info">...</span>`;
      }
    }
    ph += `<button class="page-btn" onclick="state.examplePage++;renderExamples()" ${state.examplePage===totalPages?'disabled':''}>›</button>`;
    ph += `<button class="page-btn" onclick="state.examplePage=${totalPages};renderExamples()" ${state.examplePage===totalPages?'disabled':''}>»</button>`;
    ph += `<span class="page-info">${total}件 / ${totalPages}ページ</span>`;
  }
  pag.innerHTML = ph;
}

// Search
document.getElementById('exampleSearch').addEventListener('input',function(){
  const q = this.value.trim().toLowerCase();
  state.exampleQuery = q;
  if(!q){state.exampleFiltered=EXAMPLES}else{
    state.exampleFiltered = EXAMPLES.filter(e=>
      e.grammar.toLowerCase().includes(q)||e.vocab.toLowerCase().includes(q)||e.jp.includes(q)
    );
  }
  state.examplePage=1;
  renderExamples();
});

// ===== Render Listening =====
function filterListening(){
  if(state.listeningType==='all') state.listeningFiltered = LISTENING;
  else state.listeningFiltered = LISTENING.filter(q=>q.type===state.listeningType);
}

function renderListening(){
  filterListening();
  const list = document.getElementById('listeningList');
  const pag = document.getElementById('listeningPagination');
  const total = state.listeningFiltered.length;
  const totalPages = Math.ceil(total/PER_PAGE.listening);
  if(state.listeningPage>totalPages) state.listeningPage = totalPages||1;

  const start = (state.listeningPage-1)*PER_PAGE.listening;
  const items = state.listeningFiltered.slice(start, start+PER_PAGE.listening);

  list.innerHTML = items.length===0
    ? '<div class="empty">該当する問題がありません</div>'
    : items.map((q,i)=>{
      const gid = `l_${q.id}`;
      return `
      <div class="listening-card">
        <div class="listening-type">第${start+i+1}問 — ${escHtml(q.type)}</div>
        <button class="btn-speech" id="speech_${q.id}" onclick="speakText(document.getElementById('script_${q.id}').textContent,this)">🔊 音声を再生</button>
        <span id="script_${q.id}" class="hidden">${escHtml(q.script)}</span>
        <div class="listening-question">${escHtml(q.question)}</div>
        <div class="listening-options">
          ${q.options.map((o,j)=>{
            const optId = `${gid}_${j}`;
            return `<button class="listening-opt" id="${optId}" onclick="answerListening(${q.id},${j})">${escHtml(o)}</button>`;
          }).join('')}
        </div>
        <div class="listening-original">
          <button class="btn-reveal" onclick="toggleOriginal('orig_${q.id}')">📄 スクリプトを表示</button>
          <div class="original-text" id="orig_${q.id}">${escHtml(q.script)}</div>
          <div class="explanation-text">💡 ${escHtml(q.explanation)}</div>
        </div>
      </div>`;
    }).join('');

  // pagination
  let ph = '';
  if(totalPages>1){
    ph += `<button class="page-btn" onclick="state.listeningPage=1;renderListening()" ${state.listeningPage===1?'disabled':''}>«</button>`;
    ph += `<button class="page-btn" onclick="state.listeningPage--;renderListening()" ${state.listeningPage===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=totalPages;i++){
      if(i===1||i===totalPages||(i>=state.listeningPage-2&&i<=state.listeningPage+2)){
        ph += `<button class="page-btn${i===state.listeningPage?' active':''}" onclick="state.listeningPage=${i};renderListening()">${i}</button>`;
      } else if(i===state.listeningPage-3||i===state.listeningPage+3){
        ph += `<span class="page-info">...</span>`;
      }
    }
    ph += `<button class="page-btn" onclick="state.listeningPage++;renderListening()" ${state.listeningPage===totalPages?'disabled':''}>›</button>`;
    ph += `<button class="page-btn" onclick="state.listeningPage=${totalPages};renderListening()" ${state.listeningPage===totalPages?'disabled':''}>»</button>`;
    ph += `<span class="page-info">${total}問</span>`;
  }else{
    ph = `<span class="page-info">${total}問</span>`;
  }
  pag.innerHTML = ph;
}

function answerListening(qid, chosen){
  const q = LISTENING.find(x=>x.id===qid);
  if(!q)return;
  const gid = `l_${qid}`;
  const btns = document.querySelectorAll(`[id^="${gid}_"]`);
  if(btns.length>0 && btns[0].classList.contains('answered')) return; // already answered

  btns.forEach((btn,j)=>{
    btn.classList.add('answered');
    if(j===q.answer){
      btn.classList.add('correct');
      btn.innerHTML = '<span class="result-icon">✓</span>' + btn.textContent;
    } else if(j===chosen && chosen!==q.answer){
      btn.classList.add('wrong');
      btn.innerHTML = '<span class="result-icon">✗</span>' + btn.textContent;
    }
  });
}

function toggleOriginal(id){
  const el = document.getElementById(id);
  el.classList.toggle('show');
}

// Listening type tabs
document.querySelectorAll('#listeningTabs .module-tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    document.querySelectorAll('#listeningTabs .module-tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    state.listeningType = this.dataset.type;
    state.listeningPage = 1;
    renderListening();
  });
});

// ===== Render Reading =====
function filterReading(){
  if(state.readingType==='all') state.readingFiltered = READINGS;
  else state.readingFiltered = READINGS.filter(r=>r.type===state.readingType);
}

function renderReading(){
  filterReading();
  const list = document.getElementById('readingList');
  const pag = document.getElementById('readingPagination');
  const total = state.readingFiltered.length;
  const totalPages = Math.ceil(total/PER_PAGE.reading);
  if(state.readingPage>totalPages) state.readingPage = totalPages||1;

  const idx = state.readingPage-1;
  const r = state.readingFiltered[idx];
  if(!r){list.innerHTML='<div class="empty">該当する文章がありません</div>';pag.innerHTML='';return}

  let contentHTML = '';
  if(r.type==='統合理解'){
    contentHTML = `
      <div class="reading-label">文章 A</div>
      <div class="reading-content-a">${escHtml(r.contentA||'')}</div>
      <div class="reading-label">文章 B</div>
      <div class="reading-content-b">${escHtml(r.contentB||'')}</div>`;
  } else {
    contentHTML = `<div class="reading-content">${escHtml(r.content||'')}</div>`;
  }

  list.innerHTML = `
    <div class="reading-card">
      <div class="reading-type-label module-tab active" style="display:inline-block;margin-bottom:1rem;cursor:default">${escHtml(r.type)}</div>
      <div class="reading-title">${escHtml(r.title||'')}</div>
      ${contentHTML}
      ${(r.questions||[]).map((q,qi)=>{
        const rid = `r${idx+1}q${qi}`;
        return `
        <div class="reading-question-block">
          <div class="reading-question-text">問${qi+1}. ${escHtml(q.question)}</div>
          <div class="listening-options">
            ${(q.options||[]).map((o,oi)=>{
              const correctIdx = typeof q.answer === 'number' ? (q.answer >= 1 ? q.answer - 1 : q.answer) : 0;
              return `<button class="listening-opt" id="${rid}_${oi}" onclick="answerReading('${rid}',${oi},${correctIdx})">${escHtml(o)}</button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;

  // pagination
  let ph = '';
  if(totalPages>1){
    ph += `<button class="page-btn" onclick="state.readingPage=1;renderReading()" ${state.readingPage===1?'disabled':''}>«</button>`;
    ph += `<button class="page-btn" onclick="state.readingPage--;renderReading()" ${state.readingPage===1?'disabled':''}>‹</button>`;
    ph += `<span class="page-info">${state.readingPage} / ${totalPages}</span>`;
    ph += `<button class="page-btn" onclick="state.readingPage++;renderReading()" ${state.readingPage===totalPages?'disabled':''}>›</button>`;
    ph += `<button class="page-btn" onclick="state.readingPage=${totalPages};renderReading()" ${state.readingPage===totalPages?'disabled':''}>»</button>`;
  }
  ph += `<span class="page-info" style="margin-left:12px">全${total}篇</span>`;
  pag.innerHTML = ph;
}

function answerReading(rid, chosen, correct){
  const selector = `[id^="${rid}_"]`;
  const btns = document.querySelectorAll(selector);
  if(btns.length===0)return;
  if(btns[0].classList.contains('answered'))return;
  btns.forEach((btn,i)=>{
    btn.classList.add('answered');
    if(i===correct){
      btn.classList.add('correct');
      btn.innerHTML = '<span class="result-icon">✓</span>' + btn.textContent;
    } else if(i===chosen && chosen!==correct){
      btn.classList.add('wrong');
      btn.innerHTML = '<span class="result-icon">✗</span>' + btn.textContent;
    }
  });
}

// Reading type tabs
document.querySelectorAll('#readingTabs .module-tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    document.querySelectorAll('#readingTabs .module-tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    state.readingType = this.dataset.type;
    state.readingPage = 1;
    renderReading();
  });
});

// ===== Utility =====
function escHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ===== Init =====
renderExamples();

// Stop speech when leaving page
window.addEventListener('beforeunload',()=>{if(speechSynth)speechSynth.cancel()});
</script>
